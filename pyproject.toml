[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eqsanscli"
version = "0.1.0"
description = "Interactive CLI for EQSANS data reduction at SNS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    # TUI
    "textual>=0.40.0",
    "textual-image>=0.5.0",
    "term-image>=0.7.0",

    # Data
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",

    # SNS/ORNL
    "pyoncat>=1.5.0",
    "oauthlib>=3.0.0",
    "requests-oauthlib>=1.3.0",

    # CLI
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # LLM (OpenRouter — uses OpenAI-compatible API)
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
eqsanscli = "eqsanscli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eqsanscli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
